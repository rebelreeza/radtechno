<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WJ Responses</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    background: #0c0c0c;
    color: #edeae2;
    min-height: 100vh;
  }

  /* Gate */
  #gate {
    position: fixed; inset: 0; background: #0c0c0c;
    display: flex; align-items: center; justify-content: center; z-index: 999;
  }
  #gate.hidden { display: none; }
  .gate-box { width: 320px; display: flex; flex-direction: column; gap: 16px; }
  .gate-label { font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; color: rgba(237,234,226,0.35); }
  .gate-input {
    width: 100%; padding: 11px 14px;
    background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.14);
    border-radius: 6px; color: #edeae2; font-size: 15px; font-family: inherit; outline: none;
  }
  .gate-input:focus { border-color: rgba(255,255,255,0.4); }
  .gate-btn {
    padding: 11px; border-radius: 6px; background: #edeae2; color: #0c0c0c;
    font-size: 13px; font-weight: 600; font-family: inherit; border: none; cursor: pointer;
  }
  .gate-err { font-size: 12px; color: #f87171; display: none; }
  .gate-err.show { display: block; }

  /* Layout */
  .topbar {
    position: sticky; top: 0; z-index: 100;
    background: rgba(12,12,12,0.96); backdrop-filter: blur(10px);
    border-bottom: 1px solid rgba(255,255,255,0.07);
    padding: 14px 40px; display: flex; align-items: center; justify-content: space-between;
  }
  .topbar-title { font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: rgba(237,234,226,0.45); }
  .topbar-meta { font-size: 11px; color: rgba(237,234,226,0.3); }
  .refresh-btn {
    font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase;
    background: none; border: 1px solid rgba(255,255,255,0.18); color: rgba(237,234,226,0.5);
    padding: 5px 12px; border-radius: 4px; cursor: pointer; font-family: inherit;
    transition: border-color 0.15s, color 0.15s;
  }
  .refresh-btn:hover { border-color: rgba(255,255,255,0.45); color: #edeae2; }

  .page { max-width: 860px; margin: 0 auto; padding: 40px 40px 80px; }

  .empty { color: rgba(237,234,226,0.3); font-size: 14px; padding: 60px 0; text-align: center; }

  /* Visitor block */
  .visitor-block { margin-bottom: 48px; }
  .visitor-name {
    font-size: 18px; font-weight: 600; margin-bottom: 20px;
    padding-bottom: 12px; border-bottom: 1px solid rgba(255,255,255,0.08);
    display: flex; align-items: baseline; gap: 12px;
  }
  .visitor-count { font-size: 11px; font-weight: 400; color: rgba(237,234,226,0.3); letter-spacing: 0.08em; }

  /* Response row */
  .response {
    display: grid; grid-template-columns: 200px 80px 1fr 130px;
    gap: 0; border-bottom: 1px solid rgba(255,255,255,0.05);
    padding: 14px 0; align-items: start;
  }
  .response:last-child { border-bottom: none; }
  .r-section { font-size: 11px; padding-top: 2px; }
  .r-page { font-size: 9px; letter-spacing: 0.12em; text-transform: uppercase; color: rgba(237,234,226,0.25); margin-bottom: 3px; }
  .r-card { font-size: 12px; color: rgba(237,234,226,0.6); line-height: 1.35; }
  .r-type {
    font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase;
    padding: 2px 7px; border-radius: 3px; align-self: start;
    background: rgba(255,255,255,0.07); color: rgba(237,234,226,0.4); width: fit-content;
  }
  .r-type.reaction  { background: rgba(110,168,254,0.15); color: #6ea8fe; }
  .r-type.note      { background: rgba(52,211,153,0.12); color: #34d399; }
  .r-type.qa        { background: rgba(251,146,60,0.12); color: #fb923c; }
  .r-type.benchmark { background: rgba(167,139,250,0.12); color: #a78bfa; }

  .visits-section { margin-bottom: 48px; }
  .visits-heading {
    font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase;
    color: rgba(237,234,226,0.25); margin-bottom: 16px; padding-bottom: 10px;
    border-bottom: 1px solid rgba(255,255,255,0.06);
  }
  .visit-row {
    display: flex; align-items: baseline; gap: 16px;
    padding: 9px 0; border-bottom: 1px solid rgba(255,255,255,0.04);
    font-size: 13px;
  }
  .visit-row:last-child { border-bottom: none; }
  .visit-name { color: #edeae2; font-weight: 600; min-width: 140px; }
  .visit-time { color: rgba(237,234,226,0.35); font-size: 12px; }
  .r-value { font-size: 13px; line-height: 1.6; color: #edeae2; padding-right: 20px; }
  .r-value.empty-val { color: rgba(237,234,226,0.2); font-style: italic; }
  .status-pill {
    display: inline-block; font-size: 11px; font-weight: 600; letter-spacing: 0.04em;
    padding: 3px 10px; border-radius: 4px; border: 1px solid;
  }
  .status-pill.great { background: rgba(52,211,153,0.1); color: #34d399; border-color: rgba(52,211,153,0.3); }
  .status-pill.good  { background: rgba(251,191,36,0.1); color: #fbbf24; border-color: rgba(251,191,36,0.3); }
  .status-pill.bad   { background: rgba(248,113,113,0.12); color: #f87171; border-color: rgba(248,113,113,0.3); }
  .status-pill.none  { background: rgba(255,255,255,0.05); color: rgba(237,234,226,0.4); border-color: rgba(255,255,255,0.1); }
  .r-time { font-size: 11px; color: rgba(237,234,226,0.25); text-align: right; padding-top: 2px; }

  /* Tool suggestions */
  .tools-section { margin-bottom: 56px; }
  .tools-heading {
    font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase;
    color: rgba(237,234,226,0.35); margin-bottom: 20px;
    padding-bottom: 12px; border-bottom: 1px solid rgba(255,255,255,0.08);
    display: flex; align-items: center; gap: 12px;
  }
  .tools-count { font-weight: 400; color: rgba(237,234,226,0.25); }
  .tool-card {
    border: 1px solid rgba(255,255,255,0.08); border-radius: 8px;
    padding: 18px 20px; margin-bottom: 12px;
    display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: start;
  }
  .tool-card.approved { border-color: rgba(52,211,153,0.25); background: rgba(52,211,153,0.04); }
  .tool-card.rejected { border-color: rgba(255,255,255,0.05); opacity: 0.45; }
  .tc-name { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
  .tc-category { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: rgba(237,234,226,0.35); margin-bottom: 10px; }
  .tc-field { font-size: 12px; color: rgba(237,234,226,0.55); line-height: 1.6; margin-bottom: 4px; }
  .tc-field strong { color: rgba(237,234,226,0.35); font-weight: 500; margin-right: 6px; }
  .tc-meta { font-size: 11px; color: rgba(237,234,226,0.25); margin-top: 8px; }
  .tc-actions { display: flex; flex-direction: column; gap: 8px; align-items: flex-end; }
  .tc-approve {
    background: rgba(52,211,153,0.15); border: 1px solid rgba(52,211,153,0.35);
    color: #34d399; border-radius: 5px; padding: 6px 14px;
    font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase;
    font-family: inherit; cursor: pointer; transition: background 0.15s;
  }
  .tc-approve:hover { background: rgba(52,211,153,0.28); }
  .tc-reject {
    background: none; border: 1px solid rgba(255,255,255,0.12);
    color: rgba(237,234,226,0.35); border-radius: 5px; padding: 6px 14px;
    font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;
    font-family: inherit; cursor: pointer; transition: background 0.15s;
  }
  .tc-reject:hover { background: rgba(255,255,255,0.06); }
  .tc-status {
    font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase;
    padding: 4px 10px; border-radius: 4px;
  }
  .tc-status.approved { background: rgba(52,211,153,0.12); color: #34d399; }
  .tc-status.rejected { background: rgba(255,255,255,0.06); color: rgba(237,234,226,0.3); }
  .responses-heading {
    font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase;
    color: rgba(237,234,226,0.35); margin-bottom: 20px;
    padding-bottom: 12px; border-bottom: 1px solid rgba(255,255,255,0.08);
  }
</style>
</head>
<body>

<div id="gate">
  <div class="gate-box">
    <div class="gate-label">Warren James &nbsp;·&nbsp; Response Admin</div>
    <input class="gate-input" id="gate-pw" type="password" placeholder="Password" autocomplete="off" />
    <div class="gate-err" id="gate-err">Incorrect password.</div>
    <button class="gate-btn" id="gate-btn">Enter</button>
  </div>
</div>

<div id="app" style="display:none">
  <div class="topbar">
    <span class="topbar-title">WJ Onboarding &nbsp;·&nbsp; Admin</span>
    <div style="display:flex;gap:12px;align-items:center">
      <span class="topbar-meta" id="topbar-meta"></span>
      <button class="refresh-btn" id="refresh-btn">Refresh</button>
    </div>
  </div>
  <div class="page">
    <div id="visits-section" class="visits-section" style="display:none">
      <div class="visits-heading">Site Access</div>
      <div id="visits-list"></div>
    </div>
    <div id="tools-section" class="tools-section" style="display:none">
      <div class="tools-heading">Tool Suggestions <span class="tools-count" id="tools-count"></span></div>
      <div id="tools-list"></div>
    </div>
    <div id="responses-heading" class="responses-heading" style="display:none">Visitor Responses</div>
    <div id="page"><p class="empty">Loading...</p></div>
  </div>
</div>

<script>
const GATE_PW = '020311';
const ADMIN_SECRET = 'reza2025';
const PAGE_LABELS = {
  'home': 'Home', 'ai-use-cases': 'AI Use Cases', 'roadmap': 'Roadmap',
  'erp': 'ERP Doc', 'cost-estimates': 'Cost Estimates', 'data-architecture': 'Data Architecture'
};
const Q_LABELS = ['Q1: Business context', 'Q2: Odoo experience', 'Q3: Biggest pain point', 'Q4: Falling through cracks', 'Q5: Shopify Plus', 'Q6: 90-day success signal', 'Q7: Tech vs Brand ownership'];
const KEY_LABELS = {
  'erp-bench-inventory': 'Inventory accuracy',
  'erp-bench-orders':    'Order flow',
  'erp-bench-close':     'Financial close',
  'erp-bench-purchasing':'Purchasing',
  'erp-bench-reporting': 'Reporting',
  'erp-bench-multistore':'Multi-store management',
  'erp-bench-discipline':'Data discipline',
  'erp-bench-visibility':'Failure visibility',
};
const STATUS_LABELS = { great: 'Working great', good: 'Mostly good', bad: 'Bad', none: "Doesn't exist" };

function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function parseKey(key) {
  if (KEY_LABELS[key]) {
    return { page: 'ERP Doc', card: KEY_LABELS[key], isBenchmark: true };
  }
  const prefixes = Object.keys(PAGE_LABELS).sort((a,b) => b.length - a.length);
  for (const p of prefixes) {
    if (key === p || key.startsWith(p + '-')) {
      const page = PAGE_LABELS[p];
      const slug = key.slice(p.length).replace(/^-/, '');
      const card = slug ? slug.replace(/-/g,' ').replace(/\b\w/g, c => c.toUpperCase()) : '';
      return { page, card };
    }
  }
  return { page: '', card: key };
}

function formatSection(type, key) {
  if (type === 'qa') return Q_LABELS[parseInt(key)] || 'Q' + (parseInt(key)+1);
  const { page, card } = parseKey(key);
  return { page, card };
}

function formatTime(ts) {
  const d = new Date(ts);
  return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) + ' · ' +
    d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
}

/* ── Tool suggestions ── */
function renderTools(rows) {
  const suggestions = rows.filter(r => r.type === 'tool_suggestion');
  const approvedKeys = new Set(rows.filter(r => r.type === 'tool_approved' && r.visitor === 'admin').map(r => r.key));
  const rejectedKeys = new Set(rows.filter(r => r.type === 'tool_rejected' && r.visitor === 'admin').map(r => r.key));

  if (!suggestions.length) return;

  const section = document.getElementById('tools-section');
  const list    = document.getElementById('tools-list');
  const count   = document.getElementById('tools-count');
  const pending = suggestions.filter(r => !approvedKeys.has(r.key) && !rejectedKeys.has(r.key)).length;

  section.style.display = 'block';
  count.textContent = pending + ' pending · ' + suggestions.length + ' total';

  list.innerHTML = suggestions.map(r => {
    let d = {};
    try { d = JSON.parse(r.value); } catch {}
    const isApproved = approvedKeys.has(r.key);
    const isRejected = rejectedKeys.has(r.key);
    const statusClass = isApproved ? 'approved' : isRejected ? 'rejected' : '';

    return `
      <div class="tool-card ${statusClass}" id="tc-${r.key}">
        <div>
          <div class="tc-name">${esc(d.name || 'Unnamed tool')}</div>
          <div class="tc-category">${esc(d.category || 'No category')}</div>
          ${d.assumedUse ? `<div class="tc-field"><strong>Use</strong>${esc(d.assumedUse)}</div>` : ''}
          ${d.users      ? `<div class="tc-field"><strong>Users</strong>${esc(d.users)}</div>` : ''}
          ${d.pov        ? `<div class="tc-field"><strong>Notes</strong>${esc(d.pov)}</div>` : ''}
          <div class="tc-meta">Submitted by ${esc(r.visitor)} · ${formatTime(r.updated_at)}</div>
        </div>
        <div class="tc-actions">
          ${isApproved ? '<span class="tc-status approved">Published</span>' :
            isRejected ? '<span class="tc-status rejected">Rejected</span>' : `
            <button class="tc-approve" onclick="approveTool('${esc(r.key)}', '${esc(r.value.replace(/'/g,"\\'"))}')">Approve</button>
            <button class="tc-reject"  onclick="rejectTool('${esc(r.key)}')">Reject</button>`}
        </div>
      </div>`;
  }).join('');
}

async function approveTool(key, value) {
  const card = document.getElementById('tc-' + key);
  if (card) card.style.opacity = '0.5';
  await fetch('/api/approve-tool?secret=' + ADMIN_SECRET, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ key, value, action: 'approve' })
  });
  load();
}

async function rejectTool(key) {
  const card = document.getElementById('tc-' + key);
  if (card) card.style.opacity = '0.5';
  await fetch('/api/approve-tool?secret=' + ADMIN_SECRET, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ key, value: '', action: 'reject' })
  });
  load();
}

/* ── Visitor responses ── */
function renderVisits(rows) {
  const visits = rows.filter(r => r.type === 'visit').sort((a, b) => new Date(b.updated_at) - new Date(a.updated_at));
  const section = document.getElementById('visits-section');
  const list = document.getElementById('visits-list');
  if (!visits.length) { section.style.display = 'none'; return; }
  section.style.display = 'block';
  list.innerHTML = visits.map(r => `
    <div class="visit-row">
      <span class="visit-name">${esc(r.visitor)}</span>
      <span class="visit-time">${formatTime(r.updated_at)}</span>
    </div>`).join('');
}

function renderResponses(rows) {
  const page = document.getElementById('page');
  const excluded = new Set(['tool_suggestion','tool_approved','tool_rejected','visit']);
  const filtered = rows.filter(r => !excluded.has(r.type));

  document.getElementById('topbar-meta').textContent = filtered.length + ' response' + (filtered.length !== 1 ? 's' : '');
  if (!filtered.length) { page.innerHTML = '<p class="empty">No responses yet.</p>'; return; }

  document.getElementById('responses-heading').style.display = 'block';

  const byVisitor = {};
  filtered.forEach(r => {
    if (!byVisitor[r.visitor]) byVisitor[r.visitor] = [];
    byVisitor[r.visitor].push(r);
  });

  page.innerHTML = Object.entries(byVisitor).map(([visitor, items]) => `
    <div class="visitor-block">
      <div class="visitor-name">${esc(visitor)} <span class="visitor-count">${items.length} response${items.length !== 1 ? 's' : ''}</span></div>
      ${items.map(r => {
        let secHtml, typeLabel, typeClass, valDisplay;
        if (r.type === 'qa') {
          secHtml = `<div class="r-card">${esc(formatSection(r.type, r.key))}</div>`;
          typeLabel = 'qa'; typeClass = 'qa';
          valDisplay = r.value ? esc(r.value) : '<span style="color:rgba(237,234,226,0.2);font-style:italic">cleared</span>';
        } else {
          const parsed = parseKey(r.key);
          secHtml = `<div class="r-page">${esc(parsed.page)}</div><div class="r-card">${esc(parsed.card)}</div>`;
          typeLabel = parsed.isBenchmark ? 'benchmark' : r.type;
          typeClass = parsed.isBenchmark ? 'benchmark' : esc(r.type);
          valDisplay = parsed.isBenchmark && STATUS_LABELS[r.value]
            ? `<span class="status-pill ${esc(r.value)}">${esc(STATUS_LABELS[r.value])}</span>`
            : (r.value ? esc(r.value) : '<span style="color:rgba(237,234,226,0.2);font-style:italic">cleared</span>');
        }
        return `
        <div class="response">
          <div class="r-section">${secHtml}</div>
          <div class="r-type ${typeClass}">${typeLabel}</div>
          <div class="r-value">${valDisplay}</div>
          <div class="r-time">${formatTime(r.updated_at)}</div>
        </div>`;
      }).join('')}
    </div>
  `).join('');
}

async function load() {
  document.getElementById('page').innerHTML = '<p class="empty">Loading...</p>';
  document.getElementById('tools-section').style.display = 'none';
  document.getElementById('responses-heading').style.display = 'none';
  try {
    const res = await fetch('/api/responses?secret=' + ADMIN_SECRET);
    const rows = await res.json();
    renderVisits(rows);
    renderTools(rows);
    renderResponses(rows);
  } catch (e) {
    document.getElementById('page').innerHTML = '<p class="empty">Failed to load.</p>';
  }
}

// Gate
function unlock() {
  const val = document.getElementById('gate-pw').value;
  if (val === GATE_PW) {
    document.getElementById('gate').classList.add('hidden');
    document.getElementById('app').style.display = 'block';
    load();
  } else {
    document.getElementById('gate-err').classList.add('show');
    document.getElementById('gate-pw').value = '';
  }
}
document.getElementById('gate-btn').addEventListener('click', unlock);
document.getElementById('gate-pw').addEventListener('keydown', e => { if (e.key === 'Enter') unlock(); });
document.getElementById('refresh-btn').addEventListener('click', load);
</script>
</body>
</html>
